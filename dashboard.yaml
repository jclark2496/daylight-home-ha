      grid-gap: "0"
    cards:
      - type: "custom:button-card"
        template: dh_header
        variables:
          title: Kitchen
          subtitle: "2 lights"
          back: "/daylight-home/lights"
      - type: "custom:mod-card"
        card_mod:
          style: "ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 20px 16px 0 !important; }"
        card:
          type: grid
          columns: 2
          square: false
          cards:
            - type: "custom:button-card"
              template: dh_action
              name: All on
              icon: "mdi:lightbulb-on-outline"
              tap_action:
                action: perform-action
                perform_action: light.turn_on
                target:
                  entity_id:
                    - light.kitchen_main
                    - light.kitchen_island
            - type: "custom:button-card"
              template: dh_action
              name: All off
              icon: "mdi:lightbulb-off-outline"
              tap_action:
                action: perform-action
                perform_action: light.turn_off
                target:
                  entity_id:
                    - light.kitchen_main
                    - light.kitchen_island
      - type: "custom:mod-card"
        card_mod:
          style: "ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 16px 0 !important; }"
        card:
          type: "custom:button-card"
          template: dh_section
          name: Lights
      - type: "custom:mod-card"
        card_mod:
          style: "ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 16px 24px !important; }"
        card:
          type: grid
          columns: 2
          square: false
          cards:
            - type: "custom:mushroom-light-card"
              entity: light.kitchen_main
              name: Main
              icon: "mdi:ceiling-light"
              layout: vertical
              use_light_color: true
              show_brightness_control: true
              fill_container: true
              tap_action:
                action: toggle
              hold_action:
                action: more-info
              card_mod:
                style: |
                  ha-card {
                    background: #FFFFFF !important;
                    border: none !important;
                    border-radius: 22px !important;
                    box-shadow: 0 6px 18px rgba(23,32,51,.06) !important;
                    --primary-text-color: #172033;
                    --secondary-text-color: #5F6B7A;
                    --rgb-primary-text-color: 23, 32, 51;
                    --rgb-secondary-text-color: 95, 107, 122;
                  }
