# Daylight Home - a light, two-accent mobile dashboard for Home Assistant.
# Paste into: Settings > Dashboards > (new dashboard, URL "daylight-home") > Edit > Raw configuration editor.
# Replace the placeholder entity IDs with your own (see SETUP.md). Requires the HACS cards listed in SETUP.md.
# Theme: themes/daylight.yaml. Every view sets theme: daylight.
# Accent: users whose display name matches button_card_templates.dh_base.variables.rose_users get the
# rose accent; everyone else gets blue.
title: Daylight Home
kiosk_mode:
  mobile_settings:
    hide_header: true
    kiosk: true
button_card_templates:
  dh_base:
    variables:
      rose_users: "Second User|Another User"
    styles:
      card:
        - font-family: "-apple-system,BlinkMacSystemFont,\"SF Pro Text\",Inter,system-ui,sans-serif"
        - background: "#FFFFFF"
        - border: none
        - border-radius: "22px"
        - box-shadow: "0 6px 18px rgba(23,32,51,.06)"
  dh_header:
    template: dh_base
    show_icon: false
    show_name: false
    variables:
      title: Room
      subtitle: ""
      back: "/daylight-home/home"
    tap_action:
      action: navigate
      navigation_path: "[[[ return variables.back ]]]"
    hold_action:
      action: none
    custom_fields:
      h: "[[[ const _n=(user&&user.name)||''; const _r=new RegExp('^('+variables.rose_users+')$','i').test(_n); return `<div class=\"head\"><div class=\"back\" style=\"background:${_r ? 'linear-gradient(145deg,#D81B7A 0%,#C21868 58%,#94184F 100%)' : 'linear-gradient(145deg,#247CF4 0%,#2F67E8 58%,#4056D8 100%)'}\"><ha-icon icon=\"mdi:chevron-left\"></ha-icon></div><div class=\"copy\"><div class=\"title\">${variables.title}</div><div class=\"sub\">${variables.subtitle}</div></div></div>`; ]]]"
    styles:
      card:
        - background: transparent
        - box-shadow: none
        - height: "64px"
        - padding: "16px 16px 0"
        - overflow: visible
      grid:
        - grid-template-areas: "\"h\""
      custom_fields:
        h:
          - width: "100%"
    extra_styles: |
      .head{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;text-align:left}
      .back{width:42px;height:42px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff}
      .back ha-icon{--mdc-icon-size:26px}
      .title{font-size:28px;line-height:1;font-weight:740;letter-spacing:-.75px;color:#172033}
      .sub{margin-top:4px;font-size:12.75px;line-height:1.15;font-weight:560;color:#5F6B7A}
  dh_tile:
    template: dh_base
    variables:
      path: "/daylight-home/home"
    show_label: true
    tap_action:
      action: navigate
      navigation_path: "[[[ return variables.path ]]]"
    hold_action:
      action: none
    styles:
      card:
        - height: "104px"
        - padding: "14px"
        - overflow: hidden
      grid:
        - grid-template-areas: "\"i\" \"n\" \"l\""
        - grid-template-rows: "40px 1fr 16px"
        - justify-items: start
        - row-gap: "2px"
      img_cell:
        - width: "40px"
        - height: "40px"
        - border-radius: "13px"
        - background: "[[[ const _n=(user&&user.name)||''; const _r=new RegExp('^('+variables.rose_users+')$','i').test(_n); return _r ? 'rgba(216,27,122,.10)' : 'rgba(47,103,232,.10)'; ]]]"
        - justify-self: start
      icon:
        - width: "22px"
        - color: "[[[ const _n=(user&&user.name)||''; const _r=new RegExp('^('+variables.rose_users+')$','i').test(_n); return _r ? '#B21B65' : '#2F67E8'; ]]]"
      name:
        - justify-self: start
        - align-self: end
        - font-size: "16px"
        - font-weight: "680"
        - letter-spacing: "-.15px"
        - color: "#172033"
        - line-height: "1.1"
      label:
        - justify-self: start
        - font-size: "12px"
        - font-weight: "540"
        - color: "#5F6B7A"
        - line-height: "16px"
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
        - max-width: "100%"
  dh_room:
    template: dh_tile
    variables:
      lights: []
    label: "[[[ const l=variables.lights||[]; const on=l.filter(e=>states[e]&&states[e].state==='on').length; return on ? `${on} of ${l.length} on` : 'All off'; ]]]"
  dh_toggle:
    template: dh_tile
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    label: "[[[ if(!entity) return 'Missing entity'; const s=entity.state; return s.charAt(0).toUpperCase()+s.slice(1).replace(/_/g,' '); ]]]"
    state:
      - operator: template
        value: "[[[ return entity && ['on','unlocked','open'].includes(entity.state) ]]]"
        styles:
          card:
            - box-shadow: "[[[ const _n=(user&&user.name)||''; const _r=new RegExp('^('+variables.rose_users+')$','i').test(_n); return `inset 0 0 0 2px ${_r ? '#B21B65' : '#2F67E8'}, 0 6px 18px rgba(23,32,51,.06)`; ]]]"
  dh_chip:
    template: dh_base
    show_label: false
    tap_action:
      action: perform-action
      perform_action: scene.turn_on
      target:
        entity_id: "[[[ return entity.entity_id ]]]"
    hold_action:
      action: none
    styles:
      card:
        - height: "46px"
        - border-radius: "999px"
        - padding: "0 14px"
      grid:
        - grid-template-areas: "\"i n\""
        - grid-template-columns: "18px auto"
        - column-gap: "8px"
        - justify-content: center
      icon:
        - width: "18px"
        - color: "[[[ const _n=(user&&user.name)||''; const _r=new RegExp('^('+variables.rose_users+')$','i').test(_n); return _r ? '#B21B65' : '#2F67E8'; ]]]"
      name:
        - font-size: "13.5px"
        - font-weight: "680"
        - color: "#172033"
  dh_action:
    template: dh_base
    show_label: false
    styles:
      card:
        - height: "64px"
        - border-radius: "18px"
        - padding: "8px"
      grid:
        - grid-template-areas: "\"i\" \"n\""
        - grid-template-rows: "26px auto"
      icon:
        - width: "22px"
        - color: "[[[ const _n=(user&&user.name)||''; const _r=new RegExp('^('+variables.rose_users+')$','i').test(_n); return _r ? '#B21B65' : '#2F67E8'; ]]]"
      name:
        - font-size: "13px"
        - font-weight: "660"
        - color: "#172033"
  dh_section:
    show_icon: false
    show_name: true
    tap_action:
      action: none
    hold_action:
      action: none
    styles:
      card:
        - background: transparent
        - border: none
        - box-shadow: none
        - padding: "26px 4px 12px"
      name:
        - justify-self: start
        - font-size: "19px"
        - font-weight: "740"
        - letter-spacing: "-.3px"
        - color: "#172033"
        - font-family: "-apple-system,BlinkMacSystemFont,\"SF Pro Text\",Inter,system-ui,sans-serif"
views:
  - title: Home
    path: home
    icon: "mdi:home-outline"
    theme: daylight
    background: "#F6F8FB"
    type: "custom:grid-layout"
    layout:
      grid-template-columns: "minmax(0, 430px)"
      justify-content: center
      margin: "0"
      padding: "0 0 32px"
      grid-gap: "0"
    cards:
      - type: "custom:button-card"
        template: dh_base
        show_icon: false
        show_name: false
        tap_action:
          action: none
        hold_action:
          action: none
        custom_fields:
          hero: |
            [[[ const _n=(user&&user.name)||''; const _r=new RegExp('^('+variables.rose_users+')$','i').test(_n);
            const h=new Date().getHours(); const greet=h<12?'Good morning,':h<17?'Good afternoon,':'Good evening,';
            const day=new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
            const name=(_n||'there').split(' ')[0];
            const ini=(_n||'?').split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase();
            return `<div class="hero" style="background:radial-gradient(circle at 82% 22%,rgba(255,255,255,.22),transparent 34%),${_r ? 'linear-gradient(145deg,#D81B7A 0%,#C21868 58%,#94184F 100%)' : 'linear-gradient(145deg,#247CF4 0%,#2F67E8 58%,#4056D8 100%)'}"><div class="copy"><div class="eyebrow">${greet}</div><div class="name">${name}</div><div class="date">${day}</div></div><div class="avatar"><span>${ini}</span></div></div>`;
            ]]]
          gear:
            card:
              type: "custom:button-card"
              icon: "mdi:cog-outline"
              show_name: false
              tap_action:
                action: navigate
                navigation_path: "/daylight-home/home?disable_km"
              hold_action:
                action: navigate
                navigation_path: "/config"
              styles:
                card:
                  - background: transparent
                  - box-shadow: none
                  - border: none
                  - padding: "0"
                  - width: "30px"
                  - height: "30px"
                icon:
                  - width: "18px"
                  - color: "#FFFFFF"
        styles:
          card:
            - background: transparent
            - box-shadow: none
            - padding: "16px 16px 0"
            - overflow: visible
          grid:
            - grid-template-areas: "\"hero\""
          custom_fields:
            hero:
              - width: "100%"
            gear:
              - position: absolute
              - right: "28px"
              - top: "96px"
              - width: "30px"
              - height: "30px"
              - border-radius: "999px"
              - background: "rgba(23,32,51,.35)"
              - color: "#fff"
              - display: flex
              - align-items: center
              - justify-content: center
              - "--mdc-icon-size": "18px"
        extra_styles: |
          .hero{min-height:120px;border-radius:25px;padding:18px 21px;display:grid;grid-template-columns:minmax(0,1fr) 78px;gap:18px;align-items:center;color:#fff;text-align:left;box-sizing:border-box}
          .eyebrow{font-size:15px;font-weight:620;color:rgba(255,255,255,.88);margin-bottom:8px}
          .name{font-size:38px;line-height:.95;font-weight:720;letter-spacing:-1.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .date{margin-top:10px;font-size:13px;font-weight:540;color:rgba(255,255,255,.85)}
          .avatar{width:76px;height:76px;border-radius:999px;background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 2px rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;letter-spacing:.5px;color:#fff}
      - type: "custom:mod-card"
        card_mod:
          style: "ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 18px 16px 0 !important; }"
        card:
          type: "custom:button-card"
          template: dh_base
          name: Voice
          label: Tap to talk
          icon: "mdi:microphone"
          show_label: true
          tap_action:
            action: assist
          hold_action:
            action: none
          custom_fields:
            pill: Listen
          styles:
            card:
              - height: "56px"
              - padding: "0 14px"
              - border-radius: "18px"
            grid:
              - grid-template-areas: "\"i n pill\" \"i l pill\""
              - grid-template-columns: "40px 1fr auto"
              - grid-template-rows: "1fr 1fr"
              - column-gap: "12px"
            img_cell:
              - width: "34px"
              - height: "34px"
              - border-radius: "11px"
              - background: "[[[ const _n=(user&&user.name)||''; const _r=new RegExp('^('+variables.rose_users+')$','i').test(_n); return _r ? 'rgba(216,27,122,.10)' : 'rgba(47,103,232,.10)'; ]]]"
            icon:
              - width: "18px"
              - color: "[[[ const _n=(user&&user.name)||''; const _r=new RegExp('^('+variables.rose_users+')$','i').test(_n); return _r ? '#B21B65' : '#2F67E8'; ]]]"
            name:
              - justify-self: start
              - align-self: end
              - font-size: "14.5px"
              - font-weight: "680"
              - color: "#172033"
            label:
              - justify-self: start
              - align-self: start
              - font-size: "11.5px"
              - color: "#5F6B7A"
            custom_fields:
              pill:
                - font-size: "11.5px"
                - font-weight: "680"
                - color: "[[[ const _n=(user&&user.name)||''; const _r=new RegExp('^('+variables.rose_users+')$','i').test(_n); return _r ? '#B21B65' : '#2F67E8'; ]]]"
                - background: "[[[ const _n=(user&&user.name)||''; const _r=new RegExp('^('+variables.rose_users+')$','i').test(_n); return _r ? 'rgba(216,27,122,.10)' : 'rgba(47,103,232,.10)'; ]]]"
                - padding: "5px 12px"
                - border-radius: "999px"
      - type: "custom:mod-card"
        card_mod:
          style: "ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 16px 0 !important; }"
        card:
          type: "custom:button-card"
          template: dh_section
          name: Quick access
      - type: "custom:mod-card"
        card_mod:
          style: "ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 16px 24px !important; }"
        card:
          type: grid
          columns: 2
          square: false
          cards:
            - type: "custom:button-card"
              template: dh_tile
              name: Lights
              icon: "mdi:lightbulb-outline"
              label: "Rooms & scenes"
              variables:
                path: "/daylight-home/lights"
            - type: "custom:button-card"
              template: dh_tile
              name: Security
              icon: "mdi:shield-home-outline"
              label: "Doors & alarm"
              variables:
                path: "/daylight-home/security"
            - type: "custom:button-card"
              template: dh_tile
              name: Climate
              icon: "mdi:thermostat"
              label: Thermostat
              variables:
                path: "/daylight-home/climate"
            - type: "custom:button-card"
              template: dh_tile
              name: Music
              icon: "mdi:music-note"
              label: Speakers
              variables:
                path: "/daylight-home/music"
  - title: Lights
    path: lights
    icon: "mdi:lightbulb-group-outline"
    theme: daylight
    background: "#F6F8FB"
    type: "custom:grid-layout"
    layout:
      grid-template-columns: "minmax(0, 430px)"
      justify-content: center
      margin: "0"
      padding: "0 0 32px"
      grid-gap: "0"
    cards:
      - type: "custom:button-card"
        template: dh_header
        variables:
          title: Lights
          subtitle: Choose a room
          back: "/daylight-home/home"
      - type: "custom:mod-card"
        card_mod:
          style: "ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 20px 16px 0 !important; }"
        card:
          type: grid
          columns: 3
          square: false
          cards:
            - type: "custom:button-card"
              template: dh_chip
              name: Chill
              icon: "mdi:sofa-outline"
              entity: scene.lights_chill
            - type: "custom:button-card"
              template: dh_chip
              name: Sleep
              icon: "mdi:sleep"
              entity: scene.lights_sleep
            - type: "custom:button-card"
              template: dh_chip
              name: Party
              icon: "mdi:party-popper"
              entity: scene.lights_party
      - type: "custom:mod-card"
        card_mod:
          style: "ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 16px 0 !important; }"
        card:
          type: "custom:button-card"
          template: dh_section
          name: Rooms
      - type: "custom:mod-card"
        card_mod:
          style: "ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 16px 24px !important; }"
        card:
          type: grid
          columns: 2
          square: false
          cards:
            - type: "custom:button-card"
              template: dh_room
              name: Living Room
              icon: "mdi:sofa-outline"
              variables:
                path: "/daylight-home/lights-living-room"
                lights:
                  - light.living_room_main
                  - light.living_room_lamp
            - type: "custom:button-card"
              template: dh_room
              name: Kitchen
              icon: "mdi:silverware-fork-knife"
              variables:
                path: "/daylight-home/lights-kitchen"
                lights:
                  - light.kitchen_main
                  - light.kitchen_island
            - type: "custom:button-card"
              template: dh_room
              name: Bedroom
              icon: "mdi:bed-outline"
              variables:
                path: "/daylight-home/lights-bedroom"
                lights:
                  - light.bedroom_main
                  - light.bedroom_lamp
            - type: "custom:button-card"
              template: dh_room
              name: Outside
              icon: "mdi:pine-tree"
              variables:
                path: "/daylight-home/lights-outside"
                lights:
                  - light.front_porch
                  - light.patio_string
