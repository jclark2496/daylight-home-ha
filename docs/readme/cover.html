<!doctype html>
<html lang="en">

<title>Daylight Home · README cover source</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
.cover { --ink: #152b54; --muted: #415579; color: var(--ink); position: relative; isolation: isolate; overflow: hidden; width: 100%; max-width: 1200px; aspect-ratio: 1200/508; container-type: inline-size; background: var(--paper); }
.cover h1, .cover p { margin: 0; }
.top, .foot { position: absolute; left: 4.5%; z-index: 4; }
.top { top: 9%; display: flex; align-items: center; gap: .85cqw; }
.mark { display: block; width: 1.55cqw; height: 2.4cqw; }
.word { font-size: 1.9cqw; font-weight: 700; letter-spacing: -.09cqw; }
.copy { position: absolute; z-index: 3; left: 4.5%; top: 32%; width: 47%; }
h1 { font-size: 8.8cqw; font-weight: 600; letter-spacing: -.67cqw; line-height: .88; }
.sub { font-size: 2.05cqw; line-height: 1.18; font-weight: 450; letter-spacing: -.062cqw; max-width: 31cqw; margin-top: 2.15cqw !important; }
.foot, .note { font: 500 1.07cqw/1.3 ui-monospace, Menlo, Consolas, monospace; letter-spacing: -.025cqw; }
.foot { bottom: 8%; color: var(--muted); display: flex; align-items: center; gap: .75cqw; }
.rule { height: 1px; width: 2.6cqw; background: currentColor; }
.note { position: absolute; color: var(--muted); right: 4.5%; top: 11.4%; z-index: 1; }
@media (max-width: 650px) {
  .cover { aspect-ratio: 600/550; }
  .top { top: 6%; gap: 1.5cqw; }
  .word { font-size: 3.55cqw; }
  .mark { width: 2.7cqw; height: 4.2cqw; }
  .top,.copy,.foot { left: 6%; }
  .copy { top: 18%; width: 88%; }
  h1 { font-size: 11.6cqw; letter-spacing: -.75cqw; }
  .sub { font-size: 3.9cqw; max-width: 74cqw; margin-top: 2.4cqw !important; }
  .note { right: 6%; top: 7.4%; font-size: 2.25cqw; }
  .foot { bottom: 4.5%; font-size: 2.4cqw; gap: 1.5cqw; }
  .rule { width: 5cqw; }
}

.cover { --paper: #e7efff; background: linear-gradient(110deg,#f4f7ff 6%,#e5eeff 49%,#c5d9ff 100%); }
.sun { position: absolute; z-index: -1; width: 44cqw; height: 44cqw; border-radius: 50%; top: -12cqw; right: -4cqw; background: linear-gradient(180deg,#ffedcb 10%,#fff4d6 40%,#ffe9d8 80%); }
.horizon { position: absolute; z-index: -1; right: -10%; bottom: -58%; width: 64%; height: 120%; border-radius: 50%; background: repeating-linear-gradient(0deg,rgba(99,124,192,.25) 0 1px, transparent 1px .58cqw); transform: rotate(-18deg); }
.copy { top: 28.5%; }
h1 span { display: block; }
.art { position: absolute; inset: 0 0 0 47%; overflow: clip; z-index: 2; }
.screen { position: absolute; overflow: hidden; border-radius: 1.55cqw; background: #f6f8fb; outline: 1px solid #fff9; box-shadow: .5cqw 1.6cqw 3cqw #25396833, .1cqw .2cqw .38cqw #25396828; }
.screen img { display: block; width: 100%; }
.front { width: 51%; left: 3%; top: 13%; transform: rotate(-6deg); }
.back { width: 47%; left: 55%; top: 27%; transform: rotate(7deg); }
.note { top: 6.5%; }
@media (max-width: 650px) {
  .copy { top: 19%; }
  h1 span { display: inline; }
  .art { inset: 43% 0 0 0; }
  .screen { border-radius: 2.3cqw; }
  .front { left: 12%; width: 43%; top: 10%; }
  .back { left: 57%; width: 39%; top: 28%; }
  .sun { right: -16%; top: 25%; width: 70cqw; height: 70cqw; }
  .foot { display: none; }
  .note { top: 7.3%; }
}
</style>
